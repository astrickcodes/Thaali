 if(d.label)return `<p class="hint">${esc(d.source||t('Custom nutrition per unit','प्रति इकाई दर्ज पोषण'))}</p><p class="hint">${esc(d.note||'')}</p>${d.source_url?`<a class="small" href="${esc(d.source_url)}" target="_blank" rel="noopener noreferrer">${t('Label reference (online)','लेबल संदर्भ (ऑनलाइन)')} ↗</a>`:''}<p class="hint">${t('Per-unit values × quantity. Cooking-oil settings do not alter packaged labels or manually entered dishes.','प्रति इकाई मान × मात्रा। तेल विकल्प पैकेट लेबल या स्वयं दर्ज मान नहीं बदलते।')}</p>`;
 return `<p class="hint">${t('Raw edible ingredient weights for this quantity. Water absorbed or lost changes cooked weight, not calories. Oil is in grams; 1 ml ≈ 0.92 g.','इस मात्रा की कच्ची, खाने योग्य सामग्री। पानी घटने-बढ़ने से पका वजन बदलता है, कैलोरी नहीं। तेल ग्राम में; 1 मिली ≈ 0.92 ग्राम।')}</p>${d.recipe.map(r=>{const g=r.g*qty*(r.id==='oil'?OIL[oil]:1),raw=RAW[r.id];return `<div class="ingredient-row"><div class="row between"><span>${esc(dishName(raw))}</span><strong>${g.toFixed(1)} g · ${round(raw.kcal*g/100)} kcal</strong></div><span class="source">${esc(raw.source)}${raw.note?' · '+esc(raw.note):''}</span></div>`}).join('')}<p class="hint">${t('Each nutrient = Σ (ingredient grams ÷ 100 × its per-100 g value). IFCT energy converted from kJ ÷ 4.184. Added salt/spices in small amounts are not comprehensively modelled.','हर पोषक तत्व = Σ (सामग्री ग्राम ÷ 100 × प्रति 100 ग्राम मान)। IFCT ऊर्जा: kJ ÷ 4.184। नमक व थोड़े मसालों का पूरा आकलन नहीं।')}</p>${d.note?`<p class="hint">${esc(d.note)}</p>`:''}`;
}

alName(activeMeal)+' में जोड़ें')}</button>${editing?`<div class="template-actions">${sheetStatus==='planned'?`<button class="quiet" data-action="swap-entry" data-meal="${esc(editing.meal)}" data-id="${esc(editing.id)}">${t('Swap','बदलें')}</button>`:''}<button class="quiet danger" data-action="remove-edit-entry">${t('Delete entry','प्रविष्टि हटाएँ')}</button></div>`:''}<details id="recipe-details"><summary>${t('How calculated · ingredients & sources','गणना कैसे हुई · सामग्री व स्रोत')}</summary><div id="calculation">${calculation(d,sheetQty,sheetOil)}</div></details>`;

function streak(){let n=0,d=hasFood(localDate())?localDate():shiftDate(localDate(),-1);while(hasFood(d)){n++;d=shiftDate(d,-1);if(n>10000)break}return n}
function calorieChart(days){
 const dates=Array.from({length:days},(_,i)=>shiftDate(localDate(),i-days+1)),values=dates.map(d=>dayNutrition(d).kcal),target=profileStats().target;
 const W=640,H=220,L=42,R=12,T=26,B=35,iw=W-L-R,ih=H-T-B,max=Math.max(500,target||0,...values)*1.15,bar=iw/days;
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t(`${days}-day calorie chart; target ${target||'not set'} kcal`,`${days} दिन की कैलोरी; लक्ष्य ${target||'नहीं'} kcal`)}"><title>${t('Daily calorie intake','रोज़ की कैलोरी')}</title>`;
 for(let i=0;i<=3;i++){const y=T+ih-i*ih/3;svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e3dacb"/><text x="${L-7}" y="${y+4}" text-anchor="end">${round(max*i/3)}</text>`}
 dates.forEach((d,i)=>{const h=values[i]/max*ih,x=L+i*bar+bar*.18;svg+=`<rect x="${x}" y="${T+ih-h}" width="${bar*.64}" height="${h}" rx="${days===7?4:2}" fill="${i===dates.length-1?'#93472f':'#c18a69'}"><title>${d}: ${round(values[i])} kcal</title></rect>`;if(days===7||i===0||i===14||i===days-1)svg+=`<text x="${x+bar*.32}" y="${H-12}" text-anchor="middle">${Number(d.slice(8))}/${Number(d.slice(5,7))}</text>`});
 if(target){const y=T+ih-target/max*ih;svg+=`<line class="target" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${W-R}" y="${Math.max(15,y-7)}" text-anchor="end" style="fill:#526443">${t('Guide','लक्ष्य')} ${target}</text>`}
 return svg+'</svg>';
}
function weightChart(){
 const ws=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-30),W=640,H=200,L=45,R=24,T=20,B=35,iw=W-L-R,ih=H-T-B;
 if(!ws.length)return `<div class="no-results">${t('Your first weight entry starts this chart.','पहला वजन दर्ज करने पर चार्ट बनेगा।')}</div>`;
 const min=Math.min(...ws.map(w=>w.kg))-1,max=Math.max(...ws.map(w=>w.kg))+1,start=new Date(ws[0].date+'T12:00:00').getTime(),end=new Date(ws.at(-1).date+'T12:00:00').getTime();
 const x=w=>ws.length===1?L+iw/2:L+(new Date(w.date+'T12:00:00').getTime()-start)/Math.max(1,end-start)*iw,y=w=>T+(max-w.kg)/(max-min)*ih;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Weight trend, last 30 entries','वजन का रुझान, अंतिम 30 प्रविष्टियाँ')}"><title>${t('Weight in kilograms','वजन, किलो में')}</title>${[min,(min+max)/2,max].map(v=>`<text x="${L-8}" y="${T+(max-v)/(max-min)*ih+4}" text-anchor="end">${v.toFixed(1)}</text><line x1="${L}" x2="${W-R}" y1="${T+(max-v)/(max-min)*ih}" y2="${T+(max-v)/(max-min)*ih}" stroke="#e3dacb"/>`).join('')}<polyline points="${ws.map(w=>`${x(w)},${y(w)}`).join(' ')}" fill="none" stroke="#526443" stroke-width="2.5"/>${ws.map(w=>`<circle cx="${x(w)}" cy="${y(w)}" r="4" fill="#526443"><title>${w.date}: ${w.kg} kg</title></circle>`).join('')}<text x="${L}" y="${H-12}">${esc(ws[0].date)}</text>${ws.length>1?`<text x="${W-R}" y="${H-12}" text-anchor="end">${esc(ws.at(-1).date)}</text>`:''}</svg>`;
}

><input id="weight-kg" name="kg" type="number" min="30" max="300" step="0.1" required inputmode="decimal" placeholder="65.0"></div><button class="primary" type="submit">${t('Log weight','वजन दर्ज करें')}</button></form><p class="hint">${t('Same date replaces the previous entry. Weigh at a similar time. Targets use the weight saved in Me; this chart does not change it.','उसी तारीख पर नया वजन पुरानी प्रविष्टि बदलेगा। लगभग एक समय पर तौलें। लक्ष्य “मैं” में सेव वजन से बनते हैं; यह चार्ट उसे नहीं बदलता।')}</p><div class="weight-history">${weights.slice(0,7).map(w=>`<div class="weight-row"><span>${w.date}</span><strong>${w.kg} kg</strong><button class="quiet" data-action="delete-weight" data-date="${w.date}" aria-label="${t('Delete weight for ','इस तारीख का वजन हटाएँ: ')+w.date}">×</button></div>`).join('')}</div></div>`;

function managementRow(id,name,meta,kind,mark=''){
 const selected=moreSelection===id;
 const actions=kind==='template'?[[ 'edit-template',t('Edit','बदलें')],['rename-template',t('Rename','नाम बदलें')],['clone-template',t('Duplicate','प्रति बनाएँ')],['delete-template',t('Delete','हटाएँ')]]:[['edit-custom',t('Edit','बदलें')],['custom-view',t('View nutrition','पोषण देखें')],['delete-custom',t('Delete','हटाएँ')]];
 return `<div class="management-item"><button class="settings-row" data-action="more-item" data-id="${esc(id)}" aria-expanded="${selected}" aria-controls="actions-${esc(id)}"><span class="grow"><strong>${mark}${esc(name)}</strong><small>${meta}</small></span><span class="settings-chevron" aria-hidden="true">${selected?'⌄':'›'}</span></button>${selected?`<div class="management-actions" id="actions-${esc(id)}">${actions.map(([action,label])=>`<button class="${action.startsWith('delete')?'danger':'quiet'}" data-action="${action}" data-id="${esc(id)}">${label}</button>`).join('')}</div>`:''}</div>`;
}

 if(page==='dishes')content=`<div class="more-toolbar"><button class="primary" data-action="custom">${t('+ New dish','+ नया व्यंजन')}</button></div>${state.custom.length?`<div class="settings-list">${state.custom.map(d=>managementRow(d.id,dishName(d),`${esc(unitName(d))} · ${round(nutrition(d).kcal)} kcal`,'dish')).join('')}</div>`:`<p class="more-empty">${t('No dishes from your kitchen yet.','अभी अपनी रसोई के व्यंजन नहीं हैं।')}</p>`}`;
 if(page==='tips')content=`<div class="settings-list tips-list">${TIPS.map(x=>`<details><summary>${t(x[0],x[1])}<span class="settings-chevron" aria-hidden="true">›</span></summary><p>${t(x[2],x[3])}</p></details>`).join('')}</div>`;
 if(page==='backup'){let last='';try{const date=localStorage.getItem('thaali-last-backup');if(date&&!isNaN(Date.parse(date)))last=new Date(date).toLocaleString(lang==='hi'?'hi-IN':'en-IN',{dateStyle:'medium',timeStyle:'short'})}catch(e){}content=`<p class="more-description">${t('Your diary stays in this browser. Download a JSON copy to keep or restore on another phone; nothing uploads.','लेखा इसी ब्राउज़र में रहता है। JSON प्रति सहेजें या दूसरे फ़ोन पर बहाल करें; कुछ अपलोड नहीं होता।')}</p><div class="backup-actions"><button class="primary" data-action="export">${t('Download backup','बैकअप डाउनलोड करें')}</button><button data-action="import">${t('Restore from file','फ़ाइल से बहाल करें')}</button></div>${last?`<p class="hint">${t('Last backup download','आख़िरी बैकअप डाउनलोड')}: ${esc(last)}</p>`:''}`}
 if(page==='language')content=`<div class="settings-list language-list" role="group" aria-label="${t('Choose language','भाषा चुनें')}">${[['en','English'],['hi','हिन्दी']].map(([value,label])=>`<button class="settings-row" data-action="set-language" data-lang="${value}" aria-pressed="${lang===value}"><span class="grow">${label}</span><span aria-hidden="true">${lang===value?'✓':''}</span></button>`).join('')}</div>`;
 if(page==='about')content=renderMoreAbout();
 if(page==='reset')content=`<p class="more-description">${t('Deletes profile, meals, water, weight, custom dishes and templates from this browser. Export first if you want to keep a copy.','इस ब्राउज़र से जानकारी, भोजन, पानी, वजन, अपने व्यंजन और टेम्पलेट हटेंगे। प्रति चाहिए तो पहले बैकअप निकालें।')}</p><button class="danger full" data-action="reset">${t('Delete all my Thaali data','मेरा पूरा थाली डेटा हटाएँ')}</button>`;
 return `<div class="more-view more-subpage">${moreHeading(titles[page])}${content}</div>`;
}

function renderMoreAbout(){return `<div class="more-copy source-note"><h2>${t('What is behind the numbers?','आँकड़ों के पीछे क्या है?')}</h2><p>${t(`${DISHES.length} typical serving recipes and packaged foods; ${RAW_INGREDIENTS.length} raw ingredients. Home-recipe ingredients are summed per serving, not copied as generic cooked-dish calories.`,`${DISHES.length} सामान्य सर्विंग नुस्खे व पैकेट खाद्य; ${RAW_INGREDIENTS.length} कच्ची सामग्री। घरेलू व्यंजनों के मान सामग्री जोड़कर बनते हैं, किसी सामान्य पकी सब्जी के नहीं।`)}</p><p>${t('Primary reference: ICMR–NIN Indian Food Composition Tables 2017, Table 1. Each ingredient shows its food code. Energy is kJ ÷ 4.184; carbs are available carbohydrate, fibre separate. USDA fallbacks use total carbohydrate, so carb totals mix conventions. Fibre unreported in a source is counted as 0, not known to be absent.','मुख्य स्रोत: ICMR–NIN भारतीय खाद्य संरचना तालिका 2017, तालिका 1। हर सामग्री का कोड दिखता है। ऊर्जा kJ ÷ 4.184; कार्ब्स उपलब्ध कार्बोहाइड्रेट, रेशा अलग। USDA में कुल कार्बोहाइड्रेट है, इसलिए परिभाषाएँ मिश्रित हैं। स्रोत में रेशा न होने पर गणना 0, अनुपस्थिति का दावा नहीं।')}</p><p><a href="https://www.nin.res.in/ebooks/IFCT2017.pdf" target="_blank" rel="noopener noreferrer">IFCT 2017 ↗</a> · <a href="https://fdc.nal.usda.gov/" target="_blank" rel="noopener noreferrer">USDA FoodData Central ↗</a></p><details><summary>${t('Fallbacks, proxies & limitations','वैकल्पिक मान, अनुमान व सीमाएँ')}</summary><p>${t('USDA generic values: besan, sattu (chickpea-flour proxy), mustard oil, butter oil (ghee), sugar, yogurt, lemon juice, chana saag (spinach proxy), noni (purslane) and jamun. Makhana and roasted chana use approximate Indian retail-label values, not IFCT. Ramdana lai uses puffed-rice proxy; rasgulla uses paneer for chhena; achar uses ripe-mango proxy.','USDA के सामान्य मान: बेसन, सत्तू (चना आटे का अनुमान), सरसों तेल, घी, चीनी, दही, नींबू रस, चना साग (पालक का अनुमान), नोनी (पर्सलेन), जामुन। मखाना व भुना चना भारतीय खुदरा लेबल के अनुमान हैं, IFCT नहीं। रामदाना लाई में मूढ़ी का अनुमान; रसगुल्ले में छेना के लिए पनीर; अचार में पके आम का अनुमान।')}</p><p>${t('Packaged values are label snapshots and may differ by market, variant and date. Marie, Parle-G and bread use typical pack values, not a verified current pack. Custom dishes can match your own label. Cooked yields, oil absorption, milk fat and sweets vary. No micronutrient, salt or clinical-diet tracking.','पैकेट के मान बाजार, प्रकार व तारीख से बदलते हैं। मारी, पारले-जी व ब्रेड के सामान्य मान हैं, मौजूदा पैकेट का सत्यापित लेबल नहीं। अपना लेबल “मेरे व्यंजन” में भरें। पका वजन, तेल अवशोषण, दूध की वसा व मिठाई बदलते हैं। सूक्ष्म पोषक, नमक या चिकित्सकीय आहार ट्रैकिंग नहीं।')}</p><p>${t('Existing open-source option reviewed: wger requires server-backed infrastructure and is not a single-file, local-only Bihari recipe PWA. This app is custom-built; no code copied from Aahar.','मौजूदा मुक्त स्रोत विकल्प wger देखा गया: उसे सर्वर चाहिए और वह एकल-फ़ाइल, केवल स्थानीय बिहारी नुस्खों वाला PWA नहीं। यह ऐप अलग से बनाया गया; Aahar का कोड कॉपी नहीं किया।')}</p></details></div><section class="more-copy"><h2>${t('A diary, not medical advice','लेखा, चिकित्सकीय सलाह नहीं')}</h2><p>${t('Nutrition and targets are estimates for adults 18+, not clinical diets. Pregnancy, breastfeeding, illness and children need individual advice.','पोषण व लक्ष्य 18+ वयस्कों के लिए अनुमान हैं, चिकित्सकीय आहार नहीं। गर्भावस्था, स्तनपान, बीमारी और बच्चों के लिए व्यक्तिगत सलाह लें।')}</p><h2>${t('On your phone, offline','अपने फ़ोन पर, ऑफलाइन')}</h2><p>${t('Android Chrome: menu → Add to home screen / Install. iPhone Safari: Share → Add to Home Screen. Load once online; the app then works offline. Clearing browser storage removes your diary.','Android Chrome: मेन्यू → होम स्क्रीन पर जोड़ें / इंस्टॉल। iPhone Safari: शेयर → होम स्क्रीन पर जोड़ें। पहली बार ऑनलाइन खोलें, फिर ऑफलाइन चलाएँ। ब्राउज़र डेटा मिटाने से लेखा भी मिटेगा।')}</p><p id="offline-info" class="hint">${offlineReady?t('Ready for offline use on this phone.','इस फ़ोन पर ऑफलाइन उपयोग के लिए तैयार।'):t('Offline cache prepares automatically on HTTPS or localhost.','HTTPS या localhost पर ऑफलाइन कैश अपने-आप तैयार होता है।')}</p></section>`}

function fitTemplate(template,target=profileStats().target){
 const entries=templateEntries(template),light=template.id==='suggested-halka',defaults=new Map(entries.map(e=>[e,e.qty]));if(!target||(light&&target>=sumEntries(entries).kcal))return entries;
 const staples=entries.filter(e=>['grains','dal'].includes(e.dish.category));
 const fixed=sumEntries(entries.filter(e=>!staples.includes(e))).kcal,base=sumEntries(staples).kcal;
 const factor=Math.max(0,Math.min(light?1:Infinity,(target-fixed)/(base||1)));
 for(const e of staples)e.qty=Math.max(.5,Math.min(light?defaults.get(e):(oilHeavy(e.dish)?2:10),Math.round(e.qty*factor*2)/2));
 // Half-serving adjustment minimizes the residual without changing vegetable/salad portions.
 for(let i=0;i<160;i++){
  const total=sumEntries(entries).kcal;let best=null,diff=Math.abs(total-target);
  for(const e of staples)for(const delta of [-.5,.5]){const q=e.qty+delta;if(q<.5||q>(light?defaults.get(e):(oilHeavy(e.dish)?2:10)))continue;const next=Math.abs(total+nutrition(e.dish,delta,e.oil).kcal-target);if(next<diff-.001){diff=next;best={e,q}}}
  if(!best)break;best.e.qty=best.q;
 }

}

function chartShareText(){const target=profileStats().target;return [t('Thaali — Diet chart','थाली — डाइट चार्ट'),state.profile.name, target?t(`Target: ${target} kcal/day`,`लक्ष्य: ${target} kcal/दिन`):'',...chartDays().map((d,i)=>{const n=sumEntries(d.entries);return '\n*'+chartDayName(i)+` · ${round(n.kcal)} kcal · ${n.protein.toFixed(1)} g `+t('protein','प्रोटीन')+'*\n'+MEALS.map(m=>mealName(m)+': '+chartMealSummary(d.entries,m)).join('\n')}),'\n'+t('Estimates, not medical advice.','अनुमान हैं, चिकित्सकीय सलाह नहीं।')].filter(Boolean).join('\n')}
async function shareDietChart(){const text=chartShareText();try{if(navigator.share){await navigator.share({title:t('Thaali — Diet chart','थाली — डाइट चार्ट'),text});return}if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const input=document.createElement('textarea');input.value=text;document.body.appendChild(input);input.select();const copied=document.execCommand('copy');input.remove();if(!copied)throw Error('copy')}toast(t('Week copied. Paste it into WhatsApp or a message.','हफ़्ता कॉपी हुआ। WhatsApp या संदेश में पेस्ट करें।'))}catch(e){if(e.name!=='AbortError')chartSheet(t('Share as text','टेक्स्ट शेयर करें'),`<p class="hint">${t('Select and copy your week.','अपना हफ़्ता चुनकर कॉपी करें।')}</p><textarea class="chart-share-copy" readonly>${esc(text)}</textarea>`)}}
function printDietChart(){let el=document.getElementById('chart-print');if(!el){el=document.createElement('section');el.id='chart-print';document.body.appendChild(el)}const target=profileStats().target;el.innerHTML=`<div class="chart-print-controls"><button class="quiet" data-action="chart-print-close">${t('‹ Back','‹ वापस')}</button><button class="secondary" data-action="chart-print-now">${t('Print / Save PDF','प्रिंट / PDF सेव करें')}</button></div><h1>${t('Thaali — Diet chart','थाली — डाइट चार्ट')}</h1><p>${state.profile.name?esc(state.profile.name)+' · ':''}${target?t(`Target: ${target} kcal/day`,`लक्ष्य: ${target} kcal/दिन`):t('No calorie target','कैलोरी लक्ष्य नहीं')}</p><div class="chart-print-scroll"><table><thead><tr><th scope="col">${t('Day','दिन')}</th>${MEALS.map(m=>`<th scope="col">${mealName(m)}</th>`).join('')}<th scope="col">kcal</th></tr></thead><tbody>${chartDays().map((d,i)=>`<tr><th scope="row">${chartDayName(i)}</th>${MEALS.map(m=>`<td>${esc(chartMealSummary(d.entries,m))}</td>`).join('')}<td>${round(sumEntries(d.entries).kcal)}</td></tr>`).join('')}</tbody></table></div><p class="chart-print-footer">${t('Nutrition and portions are estimates, not medical advice. For adults 18+; individual needs vary.','पोषण व मात्रा अनुमान हैं, चिकित्सकीय सलाह नहीं। 18+ वयस्कों के लिए; व्यक्तिगत ज़रूरतें अलग होती हैं।')}</p>`;document.body.classList.add('chart-printing');window.scrollTo(0,0);window.print()}
async function handleChartAction(a,b){
 if(a==='set-diet'){const value=b.dataset.diet;if(!['veg','egg','nonveg'].includes(value))return true;const previous=state.profile.diet;state.profile.diet=value;if(!persist()){state.profile.diet=previous;return true}document.getElementById('p-diet').value=value;document.querySelectorAll('[data-action="set-diet"]').forEach(el=>{const selected=el.dataset.diet===value;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected)});return true}
 if(a==='chart-fill')openChartFill();else if(a==='chart-suggest')fillDietChart(suggestChartIds());else if(a==='chart-fill-chosen')fillDietChart(CHART_DAYS.map((_,i)=>document.getElementById('chart-template-'+i).value));else if(a==='chart-edit')openChartEditor(Number(b.dataset.day));else if(a==='chart-save-template'){if(!templateDraft?.entries.length){toast(t('Add at least one dish.','कम से कम एक व्यंजन जोड़ें।'));return true}const name=prompt(t('Template name','टेम्पलेट का नाम'),chartDayName(templateDraft.chartDay));if(name?.trim())saveMyTemplate(templateEntries(templateDraft),name.trim().slice(0,80))}else if(a==='chart-send')openChartSend();else if(a==='chart-confirm-send')sendChartToPlan();else if(a==='chart-print')printDietChart();else if(a==='chart-print-now')window.print();else if(a==='chart-print-close'){document.body.classList.remove('chart-printing');document.getElementById('chart-print')?.remove()}else if(a==='chart-share')await shareDietChart();else return false;return true;
}

function handlePlannerAction(a,b){
 if(a==='templates'){navigate('templates');return true}
 if(a==='open-plan'){openPlanSheet();return true}
 if(a==='choose-plan-template'){const x=getTemplate(b.dataset.id);if(x)openPlanApply(x.suggested?fitTemplate(x):templateEntries(x),templateName(x),!!x.suggested);return true}
 if(a==='remove-edit-entry'){if(editing){day(selectedDate,true)[editing.meal]=day()[editing.meal].filter(e=>e.id!==editing.id);persist();closeSheet();render()}return true}
 if(a==='mark-eaten'){const e=day()[b.dataset.meal].find(e=>e.id===b.dataset.id);if(e){e.status='eaten';persist();render()}return true}
 if(a==='clear-plan'){if(confirm(t('Remove all planned items on this day? Eaten entries stay.','इस दिन के सभी नियोजित भोजन हटाएँ? खाया भोजन बना रहेगा।'))){for(const m of MEALS)day(selectedDate,true)[m]=day()[m].filter(isEaten);persist();render();if(sheet.open)openPlanSheet()}return true}
 if(a==='copy-yesterday'){const entries=dayPlanEntries(shiftDate(selectedDate,-1));if(!entries.length)toast(t('No entries on the previous day.','पिछले दिन कोई भोजन दर्ज नहीं।'));else openPlanApply(entries,t("Yesterday's food",'पिछले दिन का भोजन'));return true}
 if(a==='copy-day'){const entries=dayPlanEntries();if(!entries.length)toast(t('Add food to this day first.','पहले इस दिन भोजन जोड़ें।'));else openPlanApply(entries,t('Copy this day','यह दिन कॉपी करें'));return true}
 if(a==='save-template'){const entries=dayPlanEntries();if(!entries.length){toast(t('Add food to this day first.','पहले इस दिन भोजन जोड़ें।'));return true}const name=prompt(t('Template name (up to 80 characters)','टेम्पलेट का नाम (अधिकतम 80 अक्षर)'));if(name?.trim()){saveMyTemplate(entries,name.trim().slice(0,80));if(sheet.open)openPlanSheet()}return true}
 if(['apply-template','fit-template','clone-template','rename-template','delete-template'].includes(a)){
  const x=getTemplate(b.dataset.id);if(!x)return true;
  if(a==='apply-template'||a==='fit-template')openPlanApply(a==='fit-template'?fitTemplate(x):templateEntries(x),templateName(x),a==='fit-template');
  if(a==='clone-template')saveMyTemplate(templateEntries(x),x.name_en,x.name_hi);
  if(a==='rename-template'){const name=prompt(t('New template name','टेम्पलेट का नया नाम'),templateName(x));if(name?.trim()){x.name_en=x.name_hi=name.trim().slice(0,80);persist();render()}}
  if(a==='delete-template'&&confirm(t('Delete this template? Diary entries stay.','यह टेम्पलेट हटाएँ? लेखे का भोजन बना रहेगा।'))){state.templates=state.templates.filter(v=>v.id!==x.id);persist();render()}
  return true;
 }
 if(a==='confirm-plan'){const input=document.getElementById('plan-date');if(!input.reportValidity()||input.value>shiftDate(localDate(),7))return true;if(planDraft&&addPlanEntries(planDraft.entries,input.value,document.querySelector('input[name="plan-mode"]:checked')?.value==='replace')){selectedDate=input.value;closeSheet();navigate('today');toast(t('Plan ready. Tick each item when eaten.','योजना तैयार। खाने के बाद हर चीज़ चिह्नित करें।'))}return true}
 if(a==='swap-entry'){const e=day()[b.dataset.meal].find(e=>e.id===b.dataset.id);if(e)openSwap(b.dataset.meal,e);return true}
 if(a==='confirm-swap'){const e=swapEntry&&day()[swapEntry.meal].find(e=>e.id===swapEntry.id),d=[...DISHES,...state.custom].find(d=>d.id===b.dataset.id);if(e&&d){e.dish=JSON.parse(JSON.stringify(d));e.qty=Number(b.dataset.qty);persist();closeSheet();render()}return true}
 return false;
}

document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(await handleChartAction(a,b)||handleTemplateEditorAction(a,b)||handlePlannerAction(a,b))return;
 if(a==='toggle-meal'){const m=b.dataset.meal;let c=collapsedMeals();c=c.includes(m)?c.filter(x=>x!==m):c.concat(m);try{localStorage.setItem('thaali-collapsed',JSON.stringify(c))}catch(e){}const el=document.getElementById('meal-'+m);if(el)el.classList.toggle('collapsed',c.includes(m));b.setAttribute('aria-expanded',!c.includes(m));return}
 if(a==='more-open'){openMore(b.dataset.page);return}
 if(a==='more-back'){backToMore();return}
 if(a==='more-item'){moreSelection=moreSelection===b.dataset.id?'':b.dataset.id;render();document.querySelector('[data-action="more-item"][data-id="'+CSS.escape(b.dataset.id)+'"]')?.focus({preventScroll:true});return}
 if(a==='set-language'){lang=b.dataset.lang==='hi'?'hi':'en';persist();render();return}
 if(a==='edit-custom'){const d=state.custom.find(x=>x.id===b.dataset.id);if(d)openCustom(d);return}
 if(a==='tab'){navigate(b.dataset.tab);return}
 if(a==='language'){if(sheet.open&&closeSheet()===false)return;lang=lang==='hi'?'en':'hi';persist();render();return}
 if(a==='meal'||a==='add-meal'){activeMeal=b.dataset.meal;document.querySelectorAll('.meal-select button').forEach(x=>{x.classList.toggle('selected',x.dataset.meal===activeMeal);x.setAttribute('aria-pressed',x.dataset.meal===activeMeal)});renderResults();if(a==='add-meal'){document.getElementById('finder').scrollIntoView({block:'start'});document.getElementById('food-search').focus({preventScroll:true})}return}
 if(a==='category'){category=b.dataset.category;resultLimit=24;finderElement('categories').innerHTML=categoryChips();renderResults();return}
 if(a==='show-more'){resultLimit+=48;renderResults();return}
 if(a==='dish'||a==='custom-view'){const d=[...DISHES,...state.custom].find(x=>x.id===b.dataset.id);if(d){if(a==='custom-view'){tab='today';render()}openDish(d)}return}
 if(a==='close-sheet'){closeSheet();return}
 if(a==='qty'){const focused=b.dataset.delta;sheetQty=Math.max(.5,Math.min(100,sheetQty+Number(focused)));const wasOpen=document.getElementById('recipe-details').open;renderDishSheet();document.getElementById('recipe-details').open=wasOpen;document.querySelector(`[data-action="qty"][data-delta="${focused}"]`)?.focus({preventScroll:true});return}
 if(a==='oil'){sheetOil=b.dataset.oil;const wasOpen=document.getElementById('recipe-details').open;renderDishSheet();document.getElementById('recipe-details').open=wasOpen;document.querySelector(`[data-action="oil"][data-oil="${sheetOil}"]`)?.focus({preventScroll:true});return}
 if(a==='save-entry'){const weight=document.getElementById('dish-grams');if(weight&&!weight.reportValidity())return;const m=editing?editing.meal:activeMeal,e={id:editing?editing.id:uid(),qty:sheetQty,oil:sheetOil,status:sheetStatus,dish:JSON.parse(JSON.stringify(sheetDish))};const entries=day(selectedDate,true)[m];if(editing){const i=entries.findIndex(x=>x.id===editing.id);if(i>=0)entries[i]=e}else entries.push(e);const ok=persist();closeSheet();render();if(ok)toast(t('Added to your diary.','लेखे में सेव हुआ।'));return}
 if(a==='edit-entry'){const e=day()[b.dataset.meal].find(e=>e.id===b.dataset.id);if(e)openDish(e.dish,e,b.dataset.meal);return}
 if(a==='delete-entry'){const m=b.dataset.meal;day(selectedDate,true)[m]=day()[m].filter(e=>e.id!==b.dataset.id);persist();render();return}
 if(a==='repeat'){const prev=day(shiftDate(selectedDate,-1))[b.dataset.meal];if(!prev.length){toast(t('No food in that meal on the previous date.','पिछली तारीख के उस भोजन में कुछ दर्ज नहीं।'));return}if(day()[b.dataset.meal].length+prev.length>300){toast(t('This meal has too many entries.','इस भोजन में बहुत अधिक प्रविष्टियाँ हैं।'));return}day(selectedDate,true)[b.dataset.meal].push(...prev.map(e=>({...JSON.parse(JSON.stringify(e)),id:uid(),status:defaultStatus()})));const ok=persist();render();if(ok)toast(t('Previous day’s meal copied. Existing entries kept.','पिछले दिन का भोजन जोड़ा गया। मौजूदा प्रविष्टियाँ बनी रहीं।'));return}
 if(a==='water'){const d=day(selectedDate,true);d.water=Math.max(0,Math.min(30,d.water+Number(b.dataset.delta)));persist();render();return}
 if(a==='period'){period=Number(b.dataset.period);render();return}
 if(a==='delete-weight'){state.weights=state.weights.filter(w=>w.date!==b.dataset.date);persist();render();return}
 if(a==='custom'){openCustom();return}
 if(a==='custom-mode'){switchCustomMode(b.dataset.mode);return}
 if(a==='builder-add'){if(builderRows.length>=100)return;builderRows.push({id:'oil',g:5});renderBuilderRows();updateBuilderTotal();return}
 if(a==='builder-remove'){builderRows.splice(Number(b.dataset.index),1);renderBuilderRows();updateBuilderTotal();return}
 if(a==='delete-custom'){if(!confirm(t('Delete this dish? Past diary entries stay.','यह व्यंजन हटाएँ? पुराने लेखे की प्रविष्टियाँ बनी रहेंगी।')))return;state.custom=state.custom.filter(d=>d.id!==b.dataset.id);persist();render();toast(t('Custom dish removed. Past diary entries are kept.','अपना व्यंजन हटाया। पुराने लेखे की प्रविष्टियाँ बनी रहीं।'));return}
 if(a==='export'){exportBackup();return}
 if(a==='import'){document.getElementById('restore-file').click();return}
 if(a==='reset'){if(confirm(t('Delete ALL Thaali data on this phone? This cannot be undone without a backup.','इस फ़ोन का पूरा थाली डेटा मिटाएँ? बैकअप के बिना वापस नहीं आएगा।'))){state=blankState();state.lang=lang;loadError='';persist();tab='me';selectedDate=localDate();render();toast(t('Diary reset.','लेखा रीसेट हुआ।'))}return}
 if(a==='install'&&installEvent){await installEvent.prompt();installEvent=null;document.getElementById('install').classList.add('hidden')}
});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(el.id==='template-name'&&templateDraft){templateDraft.name=el.value;el.setCustomValidity('')}
 if(el.id==='food-search'||el.id==='template-food-search'){query=el.value;resultLimit=24;renderResults()}
 if(el.id==='dish-grams'&&sheetDish&&el.validity.valid&&Number(el.value)>0){sheetQty=Number(el.value)/sheetDish.grams;document.getElementById('quantity-value').textContent=Number(sheetQty.toFixed(3));document.getElementById('sheet-totals').innerHTML=sheetTotals();document.getElementById('calculation').innerHTML=calculation(sheetDish,sheetQty,sheetOil);document.querySelector('[data-action="qty"][data-delta="-0.5"]').disabled=sheetQty<=.5;document.querySelector('[data-action="qty"][data-delta="0.5"]').disabled=sheetQty>=100;}
 if(el.matches('[data-builder-grams]')){builderRows[Number(el.dataset.builderGrams)].g=Number(el.value);updateBuilderTotal()}
 if(el.id==='c-servings')updateBuilderTotal();
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.matches('[data-template-oil]')&&templateDraft){rememberTemplateMeals();templateDraft.entries[Number(el.dataset.templateOil)].oil=el.value;renderTemplateEditor();sheet.querySelector(`[data-template-oil="${el.dataset.templateOil}"]`)?.focus({preventScroll:true})}
 if(el.id==='day-date'&&validDate(el.value)&&el.value<=shiftDate(localDate(),7)){selectedDate=el.value;render()}
 if(el.id==='plan-date'&&validDate(el.value))document.getElementById('plan-mode-options').innerHTML=planModeOptions(el.value);
 if(el.matches('[data-builder-index]')){builderRows[Number(el.dataset.builderIndex)].id=el.value;updateBuilderTotal()}
 if(el.id==='restore-file')importBackup(el.files[0]);
});
document.addEventListener('submit',ev=>{
 const form=ev.target;if(!['profile-form','weight-form','custom-form'].includes(form.id))return;ev.preventDefault();if(!form.reportValidity())return;const f=new FormData(form);
 if(form.id==='profile-form'){state.profile={name:String(f.get('name')).trim(),sex:f.get('sex'),age:Number(f.get('age')),height:Number(f.get('height')),weight:Number(f.get('weight')),activity:f.get('activity'),goal:f.get('goal'),oil:f.get('oil'),diet:f.get('diet')||'nonveg'};const ok=persist();render();if(ok)toast(t('Profile saved. Your daily guide is ready.','जानकारी सेव हुई। आपका रोज़ का मार्गदर्शन तैयार है।'))}
 if(form.id==='weight-form'){const date=f.get('date'),kg=Number(f.get('kg'));if(!validDate(date)||date>localDate()||!numberOk(kg,30,300))return;state.weights=state.weights.filter(w=>w.date!==date);state.weights.push({date,kg});const ok=persist();render();if(ok)toast(t('Weight logged.','वजन दर्ज हुआ।'))}
 if(form.id==='custom-form'){
  if(!customEditId&&state.custom.length>=500){toast(t('Maximum 500 custom dishes. Export and remove some first.','अधिकतम 500 अपने व्यंजन। बैकअप निकालकर कुछ हटाएँ।'));return}
  const d={id:customEditId||'custom-'+uid(),name_en:String(f.get('en')).trim(),name_hi:String(f.get('hi')).trim(),unit:String(f.get('unit')).trim(),grams:0,category:'custom',aliases:'',oil_sensitive:false,recipe:[]};
  if(!d.name_en||!d.name_hi||!d.unit){toast(t('Please fill both names and a serving unit.','दोनों नाम और सर्विंग इकाई भरें।'));return}
  if(builderMode==='manual'){d.label=Object.fromEntries(NUTRIENTS.map(k=>[k,Number(f.get(k)||0)]));d.source=t('Custom nutrition per serving, entered by you','आपके दर्ज प्रति सर्विंग पोषण मान')}
  else{const servings=Number(document.getElementById('c-servings').value);if(!numberOk(servings,.5,1000)||!builderRows.length||builderRows.some(r=>!RAW[r.id]||!numberOk(r.g,.000001,100000))){toast(t('Add ingredients with positive grams and a valid serving count.','सामग्री के ग्राम और हिस्सों की संख्या सही भरें।'));return}d.recipe=builderDish().recipe;d.oil_sensitive=d.recipe.some(r=>r.id==='oil');d.note=t(`Home recipe: whole batch divided into ${servings} servings.`,`घरेलू नुस्खा: पूरे बर्तन को ${servings} हिस्सों में बाँटा।`)}
  const previous=state.custom;state.custom=customEditId?previous.map(x=>x.id===customEditId?d:x):previous.concat(d);const ok=persist();if(!ok){state.custom=previous;return}customEditId=null;closeSheet();render();if(ok)toast(t('Your family recipe is ready to log.','आपका व्यंजन लेखे में जोड़ने के लिए तैयार है।'));
 }
});
sheet.addEventListener('cancel',ev=>{ev.preventDefault();closeSheet()});
sheet.addEventListener('click',ev=>{if(ev.target===sheet){const r=sheet.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeSheet()}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1).split('/')[0];if(['me','today','progress','more','templates'].includes(next)){tab=next;moreSelection='';render();window.scrollTo({top:0,behavior:'instant'})}});
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installEvent=ev;document.getElementById('install').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>document.getElementById('install').classList.add('hidden'));
window.addEventListener('storage',ev=>{if(ev.key===STORAGE_KEY)showStorageError(t('The diary changed in another tab. Reload this page before editing to avoid overwriting it.','लेखा दूसरे टैब में बदला है। बदलाव करने से पहले यह पेज रीलोड करें।'))});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;if(tab==='more'){const e=document.getElementById('offline-info');if(e)e.textContent=t('Ready for offline use after this load.','इस बार खुलने के बाद ऑफलाइन इस्तेमाल के लिए तैयार।')}}).catch(()=>showStorageError(t('Offline cache is not ready. Keep online and reload once; your diary is still stored on this phone.','ऑफलाइन कैश तैयार नहीं। ऑनलाइन रहकर एक बार रीलोड करें; आपका लेखा फ़ोन में सेव है।')))}
</script>
